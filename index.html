<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Weather Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="hero">
        <p class="eyebrow">Travel Weather Planner</p>

        <h1>Explore the world. Know the weather.</h1>

        <p class="subtitle">
            Check current weather conditions and exchange rates
            across destinations around the world.
        </p>

        <div class="stats" id="stats"></div>
    </header>

    <main>
        <div class="controls">
        <input
            type="text"
            id="search"
            placeholder="Search for a city..."
            aria-label="Search for city"
        >
        
        <select id="country-filter" aria-label="Filter by country">
            <option value="All countries">All countries</option>
            <option value="Côte d'Ivoire">Côte d'Ivoire</option>
            <option value="Rwanda">Rwanda</option>
            <option value="Ghana">Ghana</option>
            <option value="Nigeria">Nigeria</option>
            <option value="Kenya">Kenya</option>
            <option value="Morocco">Morocco</option>
            <option value="Egypt">Egypt</option>
            <option value="South Africa">South Africa</option>
            <option value="Canada">Canada</option>
            <option value="United Kingdom">United Kingdom</option>
        </select>

        <select id="sort" aria-label="Sort cities">
            <option value="name">Sort by name</option>
            <option value="temp-asc">Temp: low to high</option>
            <option value="temp-desc">Temp: high to low</option>
        </select>
    </div>

    <div id="cities"></div>

    </main>

    <script src="js/cities.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>

    <footer>
        Weather data provided by 
        <a href="https://open-meteo.com/"
           target="_blank"
           rel="noopener noreferrer">Open-Meteo</a>.
        Exchange rates provided by 
        <a href="https://www.exchangerate-api.com/" 
           target="_blank"
           rel="noopener noreferrer">ExchangeRate-API</a>
    </footer>
    
</body>
</html>
